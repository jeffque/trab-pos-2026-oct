# Topologia (ver docs/arquitetura.md):
#   browser -> bff -> source-lb -> source-service (N réplicas) -> postgres-sources
#                 |-> workspace-service -> postgres-workspaces
#                 '-> assemblage-service -> postgres-assemblages
#   source-service e workers -> blob-lb -> blob-service (N réplicas) -> postgres-blob
#   workspace-service --(fila compila)--> compila-worker --(evento compilacao.resultado)--> workspace-service
#   assemblage-service --(fila assembla)--> assembla-worker --(evento assemblagem.resultado)--> assemblage-service
# Os bancos não ficam expostos no host; para inspecionar: docker compose exec postgres-sources psql -U postgres

# nome fixo do projeto: o alloy filtra os logs por ele, independente do nome da pasta
name: trab-pos-2026-oct

# healthcheck padrão dos serviços node (wget existe no alpine; curl não)
x-healthcheck: &healthcheck
  interval: 5s
  timeout: 3s
  retries: 5
  start_period: 60s

# configuração comum dos workers: o worker compila código enviado por usuários,
# então roda com recursos limitados e /tmp descartável
x-build-worker: &build-worker
  build:
    context: ./build-worker
  depends_on:
    rabbitmq:
      condition: service_healthy
    source-lb:
      condition: service_started
    blob-lb:
      condition: service_started
  env_file:
    - docker.env
  mem_limit: 512m
  cpus: 1.0
  pids_limit: 128
  tmpfs:
    - /tmp
  healthcheck:
    <<: *healthcheck
    test: ["CMD-SHELL", "wget -qO- http://localhost:3005/health/ready || exit 1"]

x-postgres: &postgres
  image: postgres:18.6-alpine
  restart: unless-stopped
  environment:
    POSTGRES_PASSWORD: passpass
  healthcheck:
    test: ["CMD", "pg_isready", "-U", "postgres"]
    interval: 3s
    timeout: 3s
    retries: 20

services:
  # um banco por serviço: cada um só recebe o schema do seu dono
  postgres-blob:
    <<: *postgres
    volumes:
      # se quiser dados persistentes, acrescente: - ./pgdata-blob:/var/lib/postgresql
      - ./postgres-schemas/creator.sh:/docker-entrypoint-initdb.d/creator.sh:ro
      - ./postgres-schemas/blob-schema:/docker-entrypoint-initdb.d/blob-schema:ro
  postgres-sources:
    <<: *postgres
    volumes:
      # se quiser dados persistentes, acrescente: - ./pgdata-sources:/var/lib/postgresql
      - ./postgres-schemas/creator.sh:/docker-entrypoint-initdb.d/creator.sh:ro
      - ./postgres-schemas/source-schema:/docker-entrypoint-initdb.d/source-schema:ro

  postgres-workspaces:
    <<: *postgres
    volumes:
      - ./postgres-schemas/creator.sh:/docker-entrypoint-initdb.d/creator.sh:ro
      - ./postgres-schemas/workspace-schema:/docker-entrypoint-initdb.d/workspace-schema:ro
  postgres-assemblages:
    <<: *postgres
    volumes:
      - ./postgres-schemas/creator.sh:/docker-entrypoint-initdb.d/creator.sh:ro
      - ./postgres-schemas/assemblage-schema:/docker-entrypoint-initdb.d/assemblage-schema:ro

  blob-service:
    build:
      context: ./blob-service
    depends_on:
      postgres-blob:
        condition: service_healthy
    deploy:
      replicas: 2
    environment:
      PGSCHEMA: blob
      PGHOST: postgres-blob
    env_file:
      - docker.env
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health/ready || exit 1"]
  blob-lb:
    image: nginx:1.29-alpine
    depends_on:
      blob-service:
        condition: service_healthy
    ports:
      - 3001:80
    volumes:
      - ./load-balancer/blob.conf:/etc/nginx/conf.d/default.conf:ro

  source-service:
    build:
      context: ./source-service
    depends_on:
      postgres-sources:
        condition: service_healthy
      blob-lb:
        condition: service_started
    deploy:
      replicas: 2
    environment:
      PGSCHEMA: source
      PGHOST: postgres-sources
    env_file:
      - docker.env
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health/ready || exit 1"]
  source-lb:
    image: nginx:1.29-alpine
    depends_on:
      source-service:
        condition: service_healthy
    ports:
      - 3002:80
    volumes:
      - ./load-balancer/source.conf:/etc/nginx/conf.d/default.conf:ro

  # workspaces de compilação: publica na fila "compila" e consome o evento "compilacao.resultado"
  workspace-service:
    build:
      context: ./workspace-service
    depends_on:
      postgres-workspaces:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      source-lb:
        condition: service_started
    ports:
      - 3004:3004
    environment:
      PGSCHEMA: workspace
      PGHOST: postgres-workspaces
    env_file:
      - docker.env
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/health/ready || exit 1"]

  # assemblagens: publica na fila "assembla" e consome o evento "assemblagem.resultado"
  assemblage-service:
    build:
      context: ./assemblage-service
    depends_on:
      postgres-assemblages:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      workspace-service:
        condition: service_started
    ports:
      - 3005:3005
    environment:
      PGSCHEMA: assemblage
      PGHOST: postgres-assemblages
    env_file:
      - docker.env
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:3005/health/ready || exit 1"]

  bff:
    build:
      context: ./bff
    depends_on:
      - source-lb
      - workspace-service
      - assemblage-service
    ports:
      - 3000:3000
    environment:
      GRAFANA_URL: http://localhost:3003
    env_file:
      - docker.env
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/ready || exit 1"]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    ports:
      # painel de administração em http://localhost:15672 (guest/guest)
      - 15672:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  # um worker por fila, escaláveis de forma independente:
  #   docker compose up -d --scale compila-worker=3
  compila-worker:
    <<: *build-worker
    environment:
      WORKER_QUEUES: compila
  assembla-worker:
    <<: *build-worker
    environment:
      WORKER_QUEUES: assembla

  # ---------- observabilidade: logs centralizados ----------
  # alloy lê o stdout dos containers -> loki guarda -> grafana consulta
  # painel: http://localhost:3003 (dashboard "Logs", filtro por Correlation ID)
  loki:
    image: grafana/loki:3.6.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    # dados em memória (some no down, como os bancos); dono = usuário 10001 da imagem
    tmpfs:
      - /loki:uid=10001,gid=10001
  alloy:
    image: grafana/alloy:v1.11.0
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    depends_on:
      - loki
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # leitura dos logs dos containers (somente leitura)
      - /var/run/docker.sock:/var/run/docker.sock:ro
  grafana:
    image: grafana/grafana:12.2.0
    depends_on:
      - loki
    ports:
      - 3003:3000
    environment:
      # acesso anônimo como admin: só para o ambiente local da disciplina
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/logs.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
