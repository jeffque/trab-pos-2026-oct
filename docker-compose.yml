services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: passpass
    ports:
      - 5432:5432
    volumes:
      # se quiser dados persistentes, descomente a próxima linha
      # - ./pgdata:/var/lib/postgresql
      - ./postgres-schemas:/docker-entrypoint-initdb.d
  blob-service:
    build:
      context: ./blob-service
    depends_on:
      - postgres
    ports:
      - 3001:3001
    environment:
      PGSCHEMA: blob
    env_file:
      - docker.env
  source-service:
    build:
      context: ./source-service
    depends_on:
      - postgres
    ports:
      - 3002:3002
    environment:
      PGSCHEMA: source
    env_file:
      - docker.env