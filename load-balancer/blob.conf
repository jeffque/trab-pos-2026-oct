# load balancer do blob-service: distribui as requisições entre as réplicas (round-robin).
# "resolve" consulta o DNS do docker a cada 5 s, então réplicas novas
# (docker compose up --scale blob-service=N) entram sem reiniciar o nginx.
resolver 127.0.0.11 valid=5s ipv6=off;

# log de acesso em JSON, com o correlation id, no mesmo formato dos serviços
log_format json_blob escape=json '{"time":"$time_iso8601","level":"info","service":"blob-lb",'
    '"msg":"proxy","method":"$request_method","path":"$request_uri","status":$status,'
    '"upstream":"$upstream_addr","duration_s":$request_time,"correlation_id":"$http_x_correlation_id"}';
map $request_uri $log_blob {
    ~^/health 0;
    default 1;
}

upstream blob {
    zone blob 64k;
    server blob-service:3001 resolve;
}

server {
    listen 80;
    client_max_body_size 10m;
    access_log /var/log/nginx/access.log json_blob if=$log_blob;

    location / {
        proxy_pass http://blob;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        # se uma réplica cair, tenta a próxima
        proxy_next_upstream error timeout http_502;
        proxy_connect_timeout 500ms;
        # mostra qual réplica respondeu (útil na demonstração)
        add_header X-Upstream $upstream_addr always;
    }
}
